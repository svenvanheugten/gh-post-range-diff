name: Post range-diff
description: Comment a git range-diff on a pull request whenever it is pushed to.
branding:
  icon: git-pull-request
  color: purple
inputs:
  github-token:
    description: Token used to read the PR timeline and post the comment. Needs pull-requests:write.
    default: ${{ github.token }}
  hide-unchanged:
    description: Leave the commits a push left unchanged out of the comment, and only say how many there were.
    default: "false"
  no-jj:
    description: Take the range-diff with git alone, without installing jj.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The version this action installs.
    - name: Resolve the version to install
      shell: bash
      run: echo "VERSION=v0.8.1" >> "$GITHUB_ENV"

    # We unfortunately can't pin the version to a specific SHA, since `gh extension install`
    # doesn't accept commit SHA's for binary extensions: https://github.com/cli/cli/issues/10837.
    #
    # We'll do the next best thing, and verify that the release is immutable instead:
    # https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/verifying-the-integrity-of-a-release#verifying-immutable-releases-and-local-artifacts
    - name: Verify release is immutable
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: gh release verify "$VERSION" --repo "svenvanheugten/gh-post-range-diff"

    # With `jj` there, the report is worked out by the change ids jj writes on
    # its commits rather than by guessing which commit of the old branch is
    # which commit of the new one; see "Better reports" in the README. Where a
    # branch carries no change ids, `git range-diff` does the guessing, but
    # each rewrite is still shown with `jj interdiff`, which leaves out what
    # only moved because the base branch did. Nothing has to be set up in the
    # checkout for it: the tool makes the checkout into a jj repository itself.
    - name: Install jj, for a sharper report
      if: inputs.no-jj != 'true'
      shell: bash
      env:
        JJ_VERSION: v0.45.1
        JJ_SHA256_X86_64: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
        JJ_SHA256_AARCH64: 7349a43dd5a20dbc998b10114daa0ee63d2ab863fb822c7eb6b0ebca5903cc69
      run: |
        set -euo pipefail

        # A runner there is no build for is not a runner to fail on: jj is what
        # makes the report sharper, not what makes it possible, and without it
        # the run falls back on `git range-diff`.
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl; sha=$JJ_SHA256_X86_64 ;;
          Linux-aarch64) target=aarch64-unknown-linux-musl; sha=$JJ_SHA256_AARCH64 ;;
          *) echo "No pinned jj build for $(uname -s)-$(uname -m); taking the range-diff with git."; exit 0 ;;
        esac

        archive="$RUNNER_TEMP/jj.tar.gz"
        curl --silent --show-error --fail --location --output "$archive" \
          "https://github.com/jj-vcs/jj/releases/download/$JJ_VERSION/jj-$JJ_VERSION-$target.tar.gz"
        echo "$sha  $archive" | sha256sum --check -

        mkdir -p "$RUNNER_TEMP/jj" "$HOME/.local/bin"
        tar --extract --file "$archive" --directory "$RUNNER_TEMP/jj"
        mv "$RUNNER_TEMP/jj/jj" "$HOME/.local/bin/jj"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Install exactly the verified version.
    - name: Install
      shell: bash
      env:
        # `gh` downloads the extension through the GitHub API, which limits
        # requests made without a token.
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh extension install "svenvanheugten/gh-post-range-diff" \
          --pin "$VERSION" --force

    - name: Run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HIDE_UNCHANGED: ${{ inputs.hide-unchanged }}
        NO_JJ: ${{ inputs.no-jj }}
      run: |
        flags=()
        case "$HIDE_UNCHANGED" in
          true) flags+=(--hide-unchanged) ;;
          false) ;;
          *) echo "hide-unchanged must be true or false, not '$HIDE_UNCHANGED'." >&2; exit 1 ;;
        esac
        case "$NO_JJ" in
          true) flags+=(--no-jj) ;;
          false) ;;
          *) echo "no-jj must be true or false, not '$NO_JJ'." >&2; exit 1 ;;
        esac

        gh post-range-diff "${flags[@]}" \
          "${{ github.event.pull_request.number }}" \
          "${{ github.event.before }}" \
          "${{ github.event.after }}"
