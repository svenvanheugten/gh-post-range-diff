name: Post range-diff
description: Comment a git range-diff on a pull request whenever it is pushed to.
branding:
  icon: git-pull-request
  color: purple
inputs:
  github-token:
    description: Token used to read the PR timeline and post the comment. Needs pull-requests:write.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Build the tool from the source of this action, at whatever ref the
    # workflow uses the action at, rather than installing a release: a
    # workflow that points at a branch runs that branch. It is built the way
    # the release workflow builds the binary it uploads.
    - name: Build
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        cabal update
        cabal build
        echo "bin=$(cabal list-bin exe:gh-post-range-diff)" >> "$GITHUB_OUTPUT"

    # With `jj` there, the report is worked out by the change ids jj writes on
    # its commits rather than by guessing which commit of the old branch is
    # which commit of the new one; see "Sharper reports" in the README. Nothing
    # has to be set up in the checkout for it: the tool makes the checkout
    # into a jj repository itself. Where a branch carries no change ids,
    # `git range-diff` is used.
    - name: Install jj, for a sharper report where the branch was made with it
      shell: bash
      env:
        JJ_VERSION: v0.45.1
        JJ_SHA256_X86_64: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
        JJ_SHA256_AARCH64: 7349a43dd5a20dbc998b10114daa0ee63d2ab863fb822c7eb6b0ebca5903cc69
      run: |
        set -euo pipefail

        # A runner there is no build for is not a runner to fail on: jj is what
        # makes the report sharper, not what makes it possible, and without it
        # the run falls back on `git range-diff`.
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl; sha=$JJ_SHA256_X86_64 ;;
          Linux-aarch64) target=aarch64-unknown-linux-musl; sha=$JJ_SHA256_AARCH64 ;;
          *) echo "No pinned jj build for $(uname -s)-$(uname -m); taking the range-diff with git."; exit 0 ;;
        esac

        archive="$RUNNER_TEMP/jj.tar.gz"
        curl --silent --show-error --fail --location --output "$archive" \
          "https://github.com/jj-vcs/jj/releases/download/$JJ_VERSION/jj-$JJ_VERSION-$target.tar.gz"
        echo "$sha  $archive" | sha256sum --check -

        mkdir -p "$RUNNER_TEMP/jj" "$HOME/.local/bin"
        tar --extract --file "$archive" --directory "$RUNNER_TEMP/jj"
        mv "$RUNNER_TEMP/jj/jj" "$HOME/.local/bin/jj"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Run the binary just built, as `gh post-range-diff` would run an
    # installed one.
    - name: Run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_POST_RANGE_DIFF: ${{ steps.build.outputs.bin }}
      run: |
        "$GH_POST_RANGE_DIFF" \
          "${{ github.event.pull_request.number }}" \
          "${{ github.event.before }}" \
          "${{ github.event.after }}"
