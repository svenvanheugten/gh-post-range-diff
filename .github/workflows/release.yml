name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft

  upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,   arch: amd64 }
          - { runner: windows-latest,   os: windows, arch: amd64, ext: .exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - run: cabal update

      - run: cabal build

      - name: Build, name, and upload the gh-extension asset
        shell: bash
        run: |
          asset="gh-post-range-diff_${GITHUB_REF_NAME}_${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "$(cabal list-bin gh-post-range-diff)" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset"

  publish:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
