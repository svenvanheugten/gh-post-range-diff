name: range-diff

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  range-diff:
    runs-on: ubuntu-latest
    steps:
      # The action is taken from the PR itself, which builds the tool from the
      # PR's source, so the report on a push is made by the version pushed.
      - uses: actions/checkout@v7
      - uses: ./
